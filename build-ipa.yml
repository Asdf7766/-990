# 小圆爸爸专属 · GitHub Actions 打未签名 IPA（无需 Mac、无需 Apple ID、无需证书）
# 用法（用户在手机浏览器上就能操作，全程约 10 分钟）：
#  1. 在 github.com 注册/登录 GitHub 账号（免费），新建一个仓库（Public 即可），名字随意，如 xiaoyuan-dad
#  2. 把 ~/workspace/xtool-build/XiaoYuanDad/ 整个文件夹上传到仓库根目录
#     （Package.swift、xtool.yml、Sources/XiaoYuanDad/ 里的 App/ContentView/index.html 都在里面）
#  3. 在仓库里新建文件 .github/workflows/build-ipa.yml，把本文件内容粘贴进去，Commit
#  4. 打开仓库 Actions 标签页 → 点 "Build unsigned IPA" → Run workflow → 等约 5-10 分钟变绿
#  5. 在那次运行页面底部 Artifacts 里下载 XiaoYuanDad-unsigned-ipa，里面就是未签名 .ipa
#  6. 再用自己的签名工具签名后装到 iPhone 上（未签名包本身不能直接装）
# 注意：本流程在云端 Mac 跑，xtool 用跑者自带的 Xcode SDK；全程不登录 Apple ID、不提供证书。
# 未在真实仓库里跑通过（没有可用的 GitHub 账号），xtool 在 macOS 跑者上是否会先要求 auth 是唯一未经验证的点；
# 若该步失败，见文件末尾的备用方案（xcodegen + xcodebuild）。
name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version on runner
        run: xcodebuild -version && swift --version

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Build unsigned IPA (no signing)
        run: |
          cd XiaoYuanDad
          xtool dev build --ipa </dev/null
          echo "--- find ipa ---"
          find . -name "*.ipa" -o -name "*.app" | head -20

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiaoYuanDad-unsigned-ipa
          path: XiaoYuanDad/**/*.ipa
          if-no-files-found: error
          retention-days: 30

# 备用方案（若 xtool 在跑者上先要求 Apple ID 登录而失败）：
#  把工程改成 XcodeGen 描述：brew install xcodegen，写一个 project.yml（target 用
#  Sources/XiaoYuanDad 里的 Swift 文件 + Resources/index.html，bundleID
#  com.xiaoyuan.dad.luxury），xcodegen generate 生成 .xcodeproj，再跑：
#    xcodebuild archive -project XiaoYuanDad.xcodeproj -scheme XiaoYuanDad \
#      -destination 'generic/platform=iOS' -archivePath build/XiaoYuanDad.xcarchive \
#      CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
#    mkdir -p Payload && cp -r build/XiaoYuanDad.xcarchive/Products/Applications/*.app Payload/
#    zip -r XiaoYuanDad-unsigned.ipa Payload
#  该命令组合在多个真实开源项目里已有成功先例（xcodebuild archive + 三个 NO 签名开关 + Payload 打包）。
