name: assemble-cpm2
on:
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Download parts
        run: |
          set -e
          curl -L -o part-00 "https://itsfileditchfiles.st/echo14/0bd97a1ad540f98e6310/f3ffd448cc433ad6"
          curl -L -o part-01 "https://itsfileditchfiles.st/echo14/1af123b2bff0a5b18e93/f5b4751dfeaa5305"
          curl -L -o part-02 "https://itsfileditchfiles.st/echo14/bf28965dde91ceadd42e/5cf7e359893e8a4e"
          curl -L -o part-03 "https://itsfileditchfiles.st/echo14/12a1f89f9851dbd6daf5/2527df211d050a92"
          curl -L -o part-04 "https://itsfileditchfiles.st/echo14/d784946e01cb8341e026/3673d0e0a498a9c8"
          ls -la part-*
      - name: Assemble and verify
        run: |
          set -e
          cat part-00 part-01 part-02 part-03 part-04 > CPM2-money-99990000-clean.ipa
          ls -la CPM2-money-99990000-clean.ipa
          echo "8b032529b710eeb397ab2fe80934ab99  CPM2-money-99990000-clean.ipa" | md5sum -c -
      - name: Upload assembled file
        run: |
          set -e
          RESP=$(curl -s -T CPM2-money-99990000-clean.ipa https://new.fileditch.com/upload.php)
          echo "$RESP"
          echo "## CPM2 assembled download" >> $GITHUB_STEP_SUMMARY
          echo "$RESP" >> $GITHUB_STEP_SUMMARY
