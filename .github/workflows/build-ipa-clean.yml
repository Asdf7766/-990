# Build unsigned IPA with GitHub Actions (no Mac, no Apple ID, no certificate needed)
# Usage:
#  1. Create a public repo on github.com, upload the whole XiaoYuanDad folder to the repo root
#  2. Create file .github/workflows/build-ipa.yml in the repo, paste this content, Commit
#  3. Open the repo Actions tab -> "Build unsigned IPA" -> Run workflow -> wait 5-10 min
#  4. Download XiaoYuanDad-unsigned-ipa from Artifacts at the bottom of that run page
#  5. Sign the unsigned .ipa with your own signing tool, then install it on your iPhone
#     (an unsigned .ipa cannot be installed directly)
name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version on runner
        run: xcodebuild -version && swift --version

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Build unsigned IPA (no signing)
        run: |
          cd XiaoYuanDad
          xtool dev build --ipa </dev/null
          echo "--- find ipa ---"
          find . -name "*.ipa" -o -name "*.app" | head -20

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiaoYuanDad-unsigned-ipa
          path: XiaoYuanDad/**/*.ipa
          if-no-files-found: error
          retention-days: 30

