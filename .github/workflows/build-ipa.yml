# Build unsigned IPA for 《仕途》(Shitu) with GitHub Actions.
# Branch career-game only: builds the Shitu xtool project at repo root.
# Does NOT touch the XiaoYuanDad project on main.
name: Build unsigned IPA (Shitu)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version on runner
        run: xcodebuild -version && swift --version

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Build unsigned IPA (no signing)
        run: |
          cd Shitu
          xtool dev build --ipa </dev/null
          echo "--- find ipa ---"
          find . -name "*.ipa" -o -name "*.app" | head -20

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shitu-unsigned-ipa
          path: Shitu/**/*.ipa
          if-no-files-found: error
          retention-days: 30
