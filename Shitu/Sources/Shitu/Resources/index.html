<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>仕途 · 晋升模拟</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --theme:#1e4634; --theme2:#122b20; --cream:#f6f0e1; --cream2:#efe6d0;
    --ink:#23261f; --red:#a3271e; --red2:#8c1f18; --gold:#b98a2f;
    --line:rgba(246,240,225,.16);
  }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(170deg,var(--theme) 0%,var(--theme2) 78%);
    background-attachment:fixed; color:var(--cream);
    max-width:520px; margin:0 auto; min-height:100%;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px);
  }
  .serif{ font-family:"Songti SC","STSong","SimSun",serif; }
  h1.title{ font-family:"Songti SC","STSong",serif; font-size:44px; letter-spacing:.18em; font-weight:700; }
  .sub{ opacity:.75; font-size:13px; letter-spacing:.28em; margin-top:6px; }
  .card{ background:var(--cream); color:var(--ink); border-radius:14px; padding:16px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .card + .card{ margin-top:12px; }
  .btn{ display:block; width:100%; border:none; border-radius:10px; padding:13px 16px; font-size:16px;
    background:var(--red); color:#fff; font-weight:600; letter-spacing:.12em; cursor:pointer; }
  .btn:active{ background:var(--red2); }
  .btn.ghost{ background:transparent; color:var(--cream); border:1px solid var(--line); font-weight:400; }
  .btn.gold{ background:var(--gold); }
  .btn:disabled{ opacity:.45; }
  .btn.small{ padding:9px 10px; font-size:14px; }
  .row{ display:flex; gap:10px; } .row > *{ flex:1; }
  .muted{ opacity:.65; font-size:12px; }
  /* 开局 */
  .linecard{ border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:12px; background:rgba(0,0,0,.18); cursor:pointer; }
  .linecard.sel{ outline:2px solid var(--gold); background:rgba(0,0,0,.3); }
  .linecard h3{ font-family:"Songti SC",serif; font-size:22px; letter-spacing:.2em; }
  .linecard p{ font-size:12.5px; opacity:.8; margin-top:6px; line-height:1.65; }
  .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:1px; }
  input.namein{ width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:rgba(0,0,0,.25); color:var(--cream); font-size:16px; margin-top:14px; }
  /* 档案卡 */
  .rank{ font-family:"Songti SC",serif; font-size:40px; font-weight:700; line-height:1.1; }
  .pgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .cell{ background:var(--cream2); border-radius:10px; padding:10px 12px; }
  .cell .k{ font-size:11.5px; color:#6f6a58; letter-spacing:.15em; }
  .cell .v{ font-size:19px; font-weight:700; margin-top:2px; font-family:"Songti SC",serif; }
  .cell .v small{ font-size:12px; font-weight:400; color:#6f6a58; }
  .bar{ height:7px; border-radius:4px; background:rgba(0,0,0,.14); overflow:hidden; margin-top:6px; }
  .bar > i{ display:block; height:100%; background:var(--red); border-radius:4px; }
  .bar.risk > i{ background:#c0392b; }
  .bar.favor > i{ background:var(--gold); }
  /* 标签页 */
  .tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:rgba(10,14,11,.92); backdrop-filter:blur(8px);
    padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);
    display:flex; max-width:520px; margin:0 auto; border-top:1px solid var(--line); }
  .tabbar button{ flex:1; background:none; border:none; color:var(--cream); opacity:.55;
    font-size:13px; padding:9px 0 5px; letter-spacing:.2em; cursor:pointer; }
  .tabbar button.on{ opacity:1; color:#fff; border-top:2px solid var(--gold); margin-top:-9px; padding-top:11px; }
  .advancebar{ position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 57px); z-index:29;
    max-width:520px; margin:0 auto; padding:0 16px; display:flex; gap:10px; }
  .advancebar .btn{ box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .shop-item,.giftrow{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px dashed rgba(0,0,0,.14); }
  .shop-item:last-child,.giftrow:last-child{ border-bottom:none; }
  .price{ color:var(--red); font-weight:700; }
  .tag{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:rgba(0,0,0,.1); margin-left:6px; color:#55503e; }
  .log{ font-size:12.5px; line-height:1.9; color:#4c4736; max-height:220px; overflow:auto; }
  .log div{ border-bottom:1px dashed rgba(0,0,0,.08); padding:2px 0; }
  /* 弹层 */
  .mask{ position:fixed; inset:0; background:rgba(5,8,6,.66); z-index:50; display:none; align-items:flex-end; justify-content:center; }
  .mask.show{ display:flex; }
  .sheet{ background:var(--cream); color:var(--ink); width:100%; max-width:520px; border-radius:18px 18px 0 0;
    padding:22px 20px calc(env(safe-area-inset-bottom) + 20px); max-height:86vh; overflow:auto; animation:up .22s ease; }
  @keyframes up{ from{ transform:translateY(30px); opacity:.4;} to{ transform:none; opacity:1;} }
  .sheet h3{ font-family:"Songti SC",serif; font-size:23px; letter-spacing:.08em; margin-bottom:8px; }
  .sheet .desc{ font-size:14px; line-height:1.75; color:#45412f; }
  .choice{ display:block; width:100%; text-align:left; margin-top:10px; padding:13px 14px; border-radius:10px;
    border:1px solid #d8cdb2; background:#fbf7ec; font-size:15px; color:var(--ink); cursor:pointer; }
  .choice:active{ background:#f1e8d2; }
  .choice.sel{ outline:2px solid var(--red); background:#f7ecd4; }
  .choice small{ display:block; margin-top:3px; color:#7a745c; font-size:12px; }
  .toast{ position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 18px); transform:translateX(-50%);
    background:rgba(12,16,13,.92); color:var(--cream); padding:10px 18px; border-radius:24px; font-size:13.5px;
    z-index:99; opacity:0; pointer-events:none; transition:opacity .25s; max-width:88%; text-align:center; }
  .toast.show{ opacity:1; }
  .big-ending{ text-align:center; padding-top:8vh; }
  .big-ending .seal{ font-family:"Songti SC",serif; font-size:56px; letter-spacing:.2em; }
  .kv{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed rgba(0,0,0,.12); font-size:14px; }
  .kv b{ font-family:"Songti SC",serif; }
  .danger{ color:#b03a2e; font-weight:700; }
  .ok{ color:#2e7d46; font-weight:700; }
  .secttl{ font-family:"Songti SC",serif; font-size:19px; letter-spacing:.14em; margin-bottom:6px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<!-- ============ 开局页 ============ -->
<div id="startScreen">
  <div style="text-align:center; margin-top:5vh;">
    <h1 class="title">仕 途</h1>
    <div class="sub">晋 升 模 拟 · 一 生 为 官</div>
  </div>
  <div id="continueBox" class="hidden" style="margin-top:26px;">
    <button class="btn gold" id="btnContinue">继 续 游 戏</button>
    <div class="muted" id="continueInfo" style="text-align:center; margin-top:8px;"></div>
  </div>
  <input class="namein" id="nameInput" placeholder="输入姓名（留空随机）" maxlength="6">
  <div id="linePick"></div>
  <button class="btn" id="btnStart" style="margin-top:18px;">开 始 这 一 生</button>
  <p class="muted" style="margin-top:14px; line-height:1.8; text-align:center;">
    三条仕途，三种人生。清廉一生光荣退休，或是铤而走险——<br>收下的每一分钱，都在暗处标好了代价。
  </p>
</div>

<!-- ============ 主界面 ============ -->
<div id="mainScreen" class="hidden">
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <div class="muted" style="letter-spacing:.25em;" id="pfTag">人 事 档 案</div>
        <div style="font-size:21px; font-weight:700; margin-top:4px;" class="serif" id="pfName">—</div>
        <div style="font-size:13px; color:#5c5744; margin-top:2px;" id="pfJob">—</div>
      </div>
      <div style="text-align:right;">
        <div class="rank" id="pfRank">—</div>
        <div style="font-size:12px; color:#5c5744;" id="pfAge">—</div>
      </div>
    </div>
    <div class="pgrid">
      <div class="cell"><div class="k">本级任职</div><div class="v" id="pfTenure">—</div></div>
      <div class="cell"><div class="k">月 薪</div><div class="v" id="pfSalary">—</div></div>
      <div class="cell"><div class="k">存 款</div><div class="v" id="pfMoney">—</div></div>
      <div class="cell"><div class="k">工 龄</div><div class="v" id="pfService">—</div></div>
    </div>
    <div style="margin-top:12px;">
      <div style="display:flex; justify-content:space-between; font-size:12px; color:#5c5744;">
        <span>政绩 <b id="pfMerit" style="color:var(--ink);">0</b></span>
        <span>声望 <b id="pfFame" style="color:var(--ink);">0</b></span>
        <span>领导好感 <b id="pfFavor" style="color:var(--ink);">0</b></span>
        <span>风险 <b id="pfRisk" style="color:var(--ink);">0</b></span>
      </div>
      <div class="bar risk"><i id="pfRiskBar" style="width:0%"></i></div>
    </div>
  </div>

  <div id="tab-archive" class="tabpage"></div>
  <div id="tab-work" class="tabpage hidden"></div>
  <div id="tab-gift" class="tabpage hidden"></div>
  <div id="tab-clean" class="tabpage hidden"></div>
  <div id="tab-promote" class="tabpage hidden"></div>

  <div class="advancebar">
    <button class="btn" id="btnMonth">推 进 一 个 月</button>
    <button class="btn gold" id="btnYear" style="flex:.62;">推进一年</button>
  </div>
  <div class="tabbar">
    <button data-tab="archive" class="on">档 案</button>
    <button data-tab="work">工 作</button>
    <button data-tab="gift">送 礼</button>
    <button data-tab="clean">廉 政</button>
    <button data-tab="promote">晋 升</button>
  </div>
</div>

<!-- ============ 通用弹层 ============ -->
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

const BRIBE_FROM = ["本地开发商王某","辖区企业老板李某","工程承包商张某","老下属赵某","商会会长刘某","矿业公司陈某","房地产老板周某"];
const BRIBE_WHAT = ["想承揽单位的工程项目","想为子女安排工作","想在检查中「被照顾」","想拿下辖区的一块地","想让你在评审中打个招呼","想摆平一起纠纷"];

function fmt(n){ return "¥" + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function pick(arr, rng){ return arr[Math.floor(rng() * arr.length) % arr.length]; }

function genLeader(state, rng){
  const line = LINES[state.lineId];
  const next = line.levels[Math.min(state.level + 1, line.levels.length - 1)];
  return { name: pick(SURNAMES, rng) + pick(GIVEN, rng), title: next.job };
}

function createGame(lineId, name, rng){
  rng = rng || Math.random;
  const line = LINES[lineId];
  const st = {
    lineId: lineId, name: name || pick(NAMEPOOL, rng),
    level: 0, job: line.levels[0].job,
    tenureMonths: 0, totalMonths: 0,
    money: 2000, merit: 0, favor: 40, fame: 10, risk: 0,
    totalBribe: 0, totalSalary: 0, totalGiftSpent: 0,
    workUses: 0, cleanStreak: 0, surrenders: 0,
    gifts: {}, leader: null, pending: null, over: null, sentence: 0,
    log: []
  };
  st.leader = genLeader(st, rng);
  st.log.push(line.enterWord + "报到：" + line.levels[0].job + "（" + line.levels[0].rank + "），仕途开始。");
  return st;
}

function ageOf(state){
  const line = LINES[state.lineId];
  const m = line.startAge * 12 + state.totalMonths;
  return { years: Math.floor(m / 12), months: m % 12 };
}
function salaryOf(state){
  const line = LINES[state.lineId];
  const lv = line.levels[state.level];
  const parts = lv.sal.map(function(v, i){ return { label: line.salaryLabels[i], amt: v }; });
  const total = lv.sal.reduce(function(a, b){ return a + b; }, 0);
  return { parts: parts, total: total };
}
function isTop(state){ return state.level >= LINES[state.lineId].levels.length - 1; }
function promotionReq(state){
  if (isTop(state)) return null;
  const lv = LINES[state.lineId].levels[state.level];
  return { years: lv.years, merit: lv.merit };
}
function canPromote(state){
  const req = promotionReq(state);
  if (!req || state.over) return false;
  return state.tenureMonths >= req.years * 12 && state.merit >= req.merit;
}

// 推进一个月（仅时间/发薪/衰减，事件由 rollEvents 另行决定）。返回 {paid, retired}
function applyMonth(state){
  if (state.over) return { paid: 0, retired: state.over === "retired" };
  const sal = salaryOf(state);
  state.money += sal.total;
  state.totalSalary += sal.total;
  state.tenureMonths += 1;
  state.totalMonths += 1;
  state.workUses = 0;
  const a = ageOf(state);
  if (a.years >= 65){
    state.over = "retired";
    state.log.push("年满 65 岁，光荣退休。");
    return { paid: sal.total, retired: true };
  }
  return { paid: sal.total, retired: false };
}
function decayRisk(state, tookBribeThisMonth){
  if (!tookBribeThisMonth && state.risk > 0){
    state.risk = Math.max(0, state.risk - 1);
    state.cleanStreak += 1;
  }
}

function doWork(state){
  if (state.over || state.workUses >= 3) return false;
  state.workUses += 1;
  state.merit += 3;
  return true;
}

function applyFx(state, fx){
  if (!fx) return;
  if (fx.merit)  state.merit  = Math.max(0, state.merit + fx.merit);
  if (fx.fame)   state.fame   = Math.max(0, state.fame + fx.fame);
  if (fx.favor)  state.favor  = clamp(state.favor + fx.favor, 0, 100);
  if (fx.risk)   state.risk   = clamp(state.risk + fx.risk, 0, 100);
  if (fx.money)  state.money  = Math.max(0, state.money + fx.money);
}

function bribeRange(state){
  const lvl = state.level;
  let min = Math.round(2500 * Math.pow(2.05, lvl) / 100) * 100;
  min = Math.min(min, 2000000);
  let max = Math.round(min * 3.2 / 100) * 100;
  max = Math.min(max, 6000000);
  return [min, max];
}
function bribeChance(state){ return 0.10 + state.level * 0.012; }
function inspectionChance(state){ return state.risk >= 15 ? state.risk * 0.0016 : 0; }
function caughtChance(state){
  return clamp(0.18 + Math.min(0.55, state.totalBribe / 3000000 * 0.55) + state.risk * 0.002, 0, 0.93);
}
function sentenceFor(totalBribe){
  if (totalBribe < 100000) return 3;
  if (totalBribe < 1000000) return 7;
  if (totalBribe < 5000000) return 12;
  return -1; // 无期徒刑
}

// 每月事件判定：优先审查，其次请托送钱，再次普通事件。返回事件对象或 null。
function rollEvents(state, rng){
  if (state.over) return null;
  if (rng() < inspectionChance(state)){
    return { type:"inspection", title:"纪委巡视 · 风声紧了",
      desc:"巡视组进驻单位，群众举报箱也摆了出来。同事们大气不敢出——你的事，到底兜不兜得住？" };
  }
  if (rng() < bribeChance(state)){
    const r = bribeRange(state);
    const amount = Math.round((r[0] + rng() * (r[1] - r[0])) / 100) * 100;
    const from = pick(BRIBE_FROM, rng), what = pick(BRIBE_WHAT, rng);
    return { type:"bribe", title:"有人请托", amount: amount, from: from,
      desc: from + " 托人约你吃了顿饭，临走塞给你一个沉甸甸的信封/手提袋，"
         + "只求你「" + what + "」。你估摸着，里面是 " + fmt(amount) + "。" };
  }
  if (rng() < 0.5){
    const ev = pick(EVENTS, rng);
    return { type:"event", title: ev.title, desc: ev.desc, choices: ev.choices };
  }
  return null;
}

function takeBribe(state, amount){
  state.money += amount;
  state.totalBribe += amount;
  state.risk = clamp(state.risk + Math.min(40, Math.round(4 + amount / 12000)), 0, 100);
  state.cleanStreak = 0;
  state.log.push("收下 " + fmt(amount) + "（累计收受 " + fmt(state.totalBribe) + "），风险上升。");
}
function refuseBribe(state){
  state.fame += 3;
  state.merit += 2;
  state.risk = Math.max(0, state.risk - 3);
  state.log.push("拒收一笔请托钱财，声望 +3。");
}

function resolveInspection(state, rng){
  if (rng() < caughtChance(state)){
    state.over = "caught";
    state.sentence = sentenceFor(state.totalBribe);
    state.log.push("审查中被查实，累计收受 " + fmt(state.totalBribe) + "，被留置。");
    return { caught: true, sentence: state.sentence };
  }
  state.risk = Math.max(0, state.risk - 10);
  state.fame += 2;
  state.log.push("巡视过关，虚惊一场。风险下降，声望 +2。");
  return { caught: false };
}

function examSet(state, rng){
  const pool = EXAMS.slice();
  const out = [];
  for (let i = 0; i < 3 && pool.length; i++){
    out.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
  }
  return out;
}
function gradeExam(state, correct, rng){
  if (correct >= 2) return { pass: true, via: "答对 " + correct + " 题，考核通过" };
  const p = Math.min(0.95, 0.8 + state.favor * 0.001);
  if (rng() < p) return { pass: true, via: "答对 " + correct + " 题，但综合评议过关（领导替你说了话）" };
  return { pass: false, via: "答对 " + correct + " 题，考核未通过，等下个周期再考" };
}

function postsOffered(state){
  const line = LINES[state.lineId];
  const next = line.levels[state.level + 1];
  if (!next) return [];
  let n = 3 + (state.favor >= 50 ? 1 : 0) + (state.favor >= 80 ? 1 : 0);
  n = Math.min(n, next.posts.length);
  return next.posts.slice(0, n).map(function(name, i){
    const b = POST_BONUS[i % POST_BONUS.length];
    return { name: name, tag: b.tag, note: b.note, fx: b.fx };
  });
}
function applyPost(state, post, rng){
  const line = LINES[state.lineId];
  state.level += 1;
  state.job = post.name;
  state.tenureMonths = 0;
  state.merit = 0;
  applyFx(state, post.fx);
  state.leader = genLeader(state, rng);
  state.log.push("晋升：" + line.levels[state.level].rank + " · " + post.name + "。");
}

function buyGift(state, idx){
  const g = GIFTS[idx];
  if (state.money < g.price) return false;
  state.money -= g.price;
  state.totalGiftSpent += g.price;
  state.gifts[idx] = (state.gifts[idx] || 0) + 1;
  return true;
}
function giveGift(state, idx){
  if (isTop(state)) return false;
  if (!state.gifts[idx]) return false;
  state.gifts[idx] -= 1;
  state.favor = clamp(state.favor + GIFTS[idx].favor, 0, 100);
  return true;
}

function surrender(state){
  if (state.over) return null;
  const refund = Math.min(state.money, state.totalBribe);
  state.money -= refund;
  const dropped = Math.min(2, state.level);
  state.level -= dropped;
  state.job = LINES[state.lineId].levels[state.level].job;
  state.tenureMonths = 0;
  state.totalBribe = 0;
  state.risk = 0;
  state.fame += 5;
  state.surrenders += 1;
  state.leader = genLeader(state, Math.random);
  state.log.push("主动自首退赃 " + fmt(refund) + "，降职 " + dropped + " 级，重新做人。");
  return { refund: refund, dropped: dropped };
}

function retireTitle(state){
  const line = LINES[state.lineId];
  const lv = state.level, top = line.levels.length - 1;
  if (lv >= top) return "位居巅峰，功成身退";
  if (lv >= top - 2) return "身居高位，善始善终";
  if (lv >= Math.floor(top / 2)) return "中流砥柱，平穩落地";
  return "默默耕耘，平安退休";
}
function summary(state){
  const line = LINES[state.lineId];
  const lv = line.levels[state.level];
  return {
    years: Math.floor(state.totalMonths / 12),
    rank: lv.rank, job: state.job,
    totalSalary: state.totalSalary, totalGiftSpent: state.totalGiftSpent,
    totalBribe: state.totalBribe, clean: state.totalBribe === 0,
    top: isTop(state), title: retireTitle(state)
  };
}

+ '<div class="kv"><span>姓名 / 系统</span><b>' + S.name + ' · ' + L.name + '</b></div>'
+ '<div class="kv"><span>最高职务</span><b>' + sm.job + '（' + sm.rank + '）</b></div>'
+ '<div class="kv"><span>' + L.svcWord + '年数</span><b>' + sm.years + ' 年</b></div>'
+ '<div class="kv"><span>一生合法收入</span><b>' + fmt(sm.totalSalary) + '</b></div>'
+ '<div class="kv"><span>送礼总支出</span><b>' + fmt(sm.totalGiftSpent) + '</b></div>'
+ '<div class="kv"><span>是否清廉</span><b>' + (sm.clean? '<span class="ok">清廉一生</span>': '<span class="danger">收受 ' + fmt(sm.totalBribe) + '</span>') + '</b></div>'
+ (S.surrenders? '<div class="kv"><span>主动自首</span><b>' + S.surrenders + ' 次（已退赃）</b></div>': '')
+ '</div>'
+ '<button class="btn" id="btnAgain" style="margin-top:20px;">再 来 一 生</button></div>');
$("mask").classList.add("show");
$("btnAgain").onclick = function(){
localStorage.removeItem(SAVE_KEY); location.reload();
};
}

// ---------- 启动 ----------
setTheme(LINES.army);
renderLinePick();
refreshContinue();
